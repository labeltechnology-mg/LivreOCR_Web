name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Production settings check
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-0123456789-0123456789-0123456789
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level ERROR

      - name: Tests
        run: python manage.py test --verbosity 2

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: livreocr-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: OCR tools and languages are present in the image
        run: |
          docker run --rm --entrypoint sh livreocr-web:ci -c '
            tesseract --list-langs | tee /tmp/langs &&
            for lang in fra eng deu lat spa por osd deu_latf; do grep -qx "$lang" /tmp/langs || { echo "missing language: $lang"; exit 1; }; done &&
            ocrmypdf --version && gs --version'
