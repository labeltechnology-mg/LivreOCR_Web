# Local/production-like stack: the web app with PostgreSQL.
#   cp .env.example .env     (then edit the secrets)
#   docker compose up --build
#   docker compose exec web python manage.py createsuperuser
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: livreocr
      POSTGRES_USER: livreocr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livreocr -d livreocr"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: livreocr-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      # Plain http on localhost. Behind a real HTTPS reverse proxy, set DJANGO_HTTPS=1.
      DJANGO_HTTPS: ${DJANGO_HTTPS:-0}
      DATABASE_URL: postgres://livreocr:${POSTGRES_PASSWORD}@db:5432/livreocr
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-900}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-gemma3:4b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600}
    ports:
      - "8000:8000"
    volumes:
      - media-data:/data/media

volumes:
  db-data:
  media-data:
